name: 问题反馈
description: 报告可以复现的问题，请去除私密信息
body:
  - type: input
    id: platform
    attributes:
      label: Windows 系统与运行方式
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤、预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 屏幕缩放、浏览器或播放器、连接诊断等补充信息
      description: 不要上传 auth.json、Codex 对话内容或未脱敏日志。
