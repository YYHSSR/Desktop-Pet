name: Promote Verified Windows Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful Build Windows App run ID for this exact tag commit'
        required: true
        type: number
      candidate_artifact_id:
        description: 'Immutable candidate artifact ID from that run'
        required: true
        type: number
      receipt_sha256:
        description: 'SHA-256 of candidate-receipt.json reviewed during desktop acceptance'
        required: true
        type: string
      acceptance_record_json:
        description: 'JSON: run ID, commit, four SHA-256 values, desktop and resource checks for both variants'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require tag and checkout matching verifier
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Run promotion on a v* tag'; exit 1; }
      - uses: actions/checkout@v4

      - name: Verify source run, commit and immutable artifact metadata
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Invalid receipt SHA-256'; exit 1; }
          commit=$(git rev-parse HEAD)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          echo "$run" | jq -e --arg commit "$commit" '
            .conclusion == "success" and .head_sha == $commit
            and (.path | startswith(".github/workflows/build-windows.yml@"))
          ' >/dev/null
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          echo "$artifact" | jq -e --argjson run "$RUN_ID" --arg name "dsh-pet-windows-candidate-run-$RUN_ID" '
            .expired == false and .name == $name and .workflow_run.id == $run
          ' >/dev/null
          # The by-tag REST endpoint returns published releases only; authenticated
          # list pagination includes drafts, so an existing draft cannot be missed.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases-pages.jsonl
          jq -s --arg tag "$GITHUB_REF_NAME" '
            [.[][] | select(.tag_name == $tag)] |
            if length == 0 then empty elif length == 1 then .[0] else error("duplicate tag releases") end
          ' releases-pages.jsonl > release.json
          release_json=()
          if [[ -s release.json ]]; then release_json=(--release-json release.json); fi
          python scripts/promote_candidate.py preflight "${release_json[@]}" \
            --tag "$GITHUB_REF_NAME" --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --commit "$commit" --receipt-sha256 "$RECEIPT_SHA256" \
            --body release-body.md --output "$GITHUB_OUTPUT"

      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify receipt and desktop acceptance for all four attachments
        shell: bash
        env:
          ACCEPTANCE_JSON: ${{ inputs.acceptance_record_json }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$ACCEPTANCE_JSON" > acceptance-record.json
          python scripts/candidate_release.py accept --candidate-dir candidate --record acceptance-record.json \
            --run-id "$RUN_ID" --commit "$(git rev-parse HEAD)" --receipt-sha256 "$RECEIPT_SHA256"
          sha256sum candidate/*-portable.zip candidate/*-setup.exe

      - name: Archive promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-promotion-evidence-${{ github.run_id }}
          path: |
            acceptance-record.json
            candidate/candidate-receipt.json
            candidate/source-snapshot.json
          if-no-files-found: error

      - name: Create draft with unchanged verified files
        if: steps.preflight.outputs.release_state == 'create'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            candidate/dsh-pet-standalone-webm-chat-portable.zip
            candidate/dsh-pet-standalone-webm-chat-setup.exe
            candidate/dsh-pet-standalone-webm-portable.zip
            candidate/dsh-pet-standalone-webm-setup.exe
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          body_path: release-body.md
          draft: true

      - name: Recover only matching draft attachments
        if: steps.preflight.outputs.release_state == 'resume'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          release_id=$(jq -er '.id | select(type == "number" and . > 0)' release.json)
          python scripts/promote_candidate.py recover --release-id "$release_id" \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --run-id "$RUN_ID" \
            --artifact-id "$ARTIFACT_ID" --commit "$(git rev-parse HEAD)" \
            --receipt-sha256 "$RECEIPT_SHA256" --candidate-dir candidate --published published

      - name: Re-download draft attachments and verify every SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$GITHUB_REF_NAME" --dir published --pattern 'dsh-pet-standalone-*' --clobber
          cp candidate/candidate-receipt.json candidate/source-snapshot.json candidate/generated-* published/
          python scripts/candidate_release.py verify --candidate-dir published

      - name: Publish verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
