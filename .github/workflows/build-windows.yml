name: Build Windows App

on:
  workflow_dispatch:        # 手动构建候选；发布由 promote-windows-release.yml 晋级原文件
  push:
    tags:
      - 'v*'                # 打 tag 时自动构建和验证候选包；人工验收后手动发布

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    # 编码隔离（issue #26）：PYTHONIOENCODING 只解决控制台输出，
    # PYTHONUTF8=1 让 locale.getpreferredencoding() 恒为 utf-8，杜绝
    # PyInstaller/辅助脚本按 GBK/cp1252 二次解码中文源码或资源。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows-music.txt -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # choco 的 innosetup 包不带 ChineseSimplified.isl（官方安装包才附带），
      # 缺少该文件 .iss 编译会失败，从 issrc 仓库取回。
      - name: Fetch ChineseSimplified language file
        shell: pwsh
        run: |
          $langDir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\Languages'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' -OutFile (Join-Path $langDir 'ChineseSimplified.isl')

      - name: Snapshot complete tracked build inputs
        shell: pwsh
        run: |
          $candidate = "dist-onedir/candidates/run-${{ github.run_id }}"
          $language = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\Languages\ChineseSimplified.isl'
          python scripts/candidate_release.py snapshot --root . --dist dist-onedir --candidate-dir $candidate --ucrt-bin "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" --language-file $language --build-command "scripts/build_native.ps1; scripts/build_onedir.ps1 -Variant webm-chat -SkipZip; scripts/build_onedir.ps1 -Variant webm -SkipZip; ISCC.exe packaging/dsh-pet.iss (both variants)"

      - name: Build and test native collision core
        shell: pwsh
        run: .\scripts\build_native.ps1 -UcrtBin "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Native Release negative control
        shell: pwsh
        run: |
          $ucrtBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $env:PATH = "$ucrtBin;$env:PATH"
          $env:PET_CORE_TEST_INJECT_FAILURE = '1'
          try {
            & (Join-Path $ucrtBin 'ctest.exe') --test-dir build-native\ucrt64-release --output-on-failure --no-tests=error
            if ($LASTEXITCODE -eq 0) { throw 'Injected native failure passed unexpectedly' }
            New-Item -ItemType Directory -Path build-native/reports -Force | Out-Null
            Copy-Item build-native/ucrt64-release/Testing/Temporary/LastTest.log build-native/reports/ctest-negative.log
          } finally {
            Remove-Item Env:PET_CORE_TEST_INJECT_FAILURE -ErrorAction SilentlyContinue
          }
          & (Join-Path $ucrtBin 'ctest.exe') --test-dir build-native\ucrt64-release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Native Release checks failed after negative control' }

      # 与 Linux/macOS 一致：构建前先跑测试套件，避免发布损坏产物。
      # 命令与 PR 门禁（pr-test.yml）保持同一套：时序 flake 家族从主套件里
      # 隔离成独立步骤——它们会让整个 pytest 进程原生崩溃（exit 139/access
      # violation），从而拖垮同一进程里其它测试的结果报告。隔离不掩盖失败：
      # 每一族照常判红，只额外给一次重跑机会（与门禁一致）。
      - name: Pytest (main suite)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=build-native/reports/pytest-main.xml --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py

      - name: Pytest (webm lifecycle family, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=build-native/reports/pytest-webm-lifecycle.xml tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py || python -m pytest -q --junitxml=build-native/reports/pytest-webm-lifecycle.xml tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      - name: Pytest (low-priority warm family, isolated + one retry)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=build-native/reports/pytest-low-priority-warm.xml tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q --junitxml=build-native/reports/pytest-low-priority-warm.xml tests/test_low_priority_warm_interaction_yield.py

      # 与上游发布一致：只构建 webm 两个变体（GIF 包体约 800 MB，不发布）
      - name: Build onedir variants
        shell: pwsh
        run: |
          $ucrtBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $pythonExe = (Get-Command python).Source
          $candidate = "dist-onedir/candidates/run-${{ github.run_id }}"
          foreach ($VARIANT in 'webm-chat', 'webm') {
            Write-Host "==> building $VARIANT"
            & "$env:GITHUB_WORKSPACE\scripts\build_onedir.ps1" -Variant $VARIANT -PythonExe $pythonExe -UcrtBin $ucrtBin -SkipZip
            if ($LASTEXITCODE -ne 0) { throw "$VARIANT build failed" }
            Copy-Item packaging/build_variant.py (Join-Path $candidate "generated-$VARIANT-build_variant.py")
            Copy-Item "dsh-pet-standalone-${VARIANT}.spec" (Join-Path $candidate "generated-${VARIANT}.spec")
          }

      - name: Embed prebuild manifests in both app variants
        shell: pwsh
        run: python scripts/candidate_release.py embed --root . --dist dist-onedir --candidate-dir "dist-onedir/candidates/run-${{ github.run_id }}"

      # 参数用数组 splatting 传递：行首 /D... 会被 pwsh 当作除法运算符，
      # 含括号的显示名（如 "(WebM)"）会触发子表达式解析而报 ParserError。
      # 版本号从 pet/__init__.py 的 __version__ 单一来源读取，避免与
      # updater 更新检测基准漂移。
      - name: Compile installers (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path 'pet\__init__.py' -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
          Write-Host "==> AppVersion from __version__: $version"
          & ISCC.exe packaging\dsh-pet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC webm-chat failed" }
          $webm = @(
            '/DMyAppShortName=dsh-pet-standalone-webm',
            '/DMyAppExeName=dsh-pet-standalone-webm.exe',
            '/DMyAppDir=..\dist-onedir\dsh-pet-standalone-webm',
            '/DMyAppId={{3424d6cc-af3c-4383-8797-ab520b923aa6}',
            '/DMyAppDisplay=dsh-pet-standalone (WebM)',
            "/DMyAppVersion=$version",
            'packaging\dsh-pet.iss'
          )
          & ISCC.exe @webm
          if ($LASTEXITCODE -ne 0) { throw "ISCC webm failed" }
          Get-ChildItem dist-onedir\*-setup.exe | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Finalize candidate receipt and unique zip files
        shell: pwsh
        run: |
          $candidate = "dist-onedir/candidates/run-${{ github.run_id }}"
          python scripts/candidate_release.py finalize --root . --dist dist-onedir --candidate-dir $candidate
          Copy-Item scripts/verify_portable_native.ps1 $candidate
          Copy-Item scripts/candidate_release.py $candidate
          Copy-Item build-native/reports/*.xml $candidate
          Copy-Item build-native/reports/ctest-negative.log $candidate
          Copy-Item build-native/ucrt64-release/Testing/Temporary/LastTest.log $candidate
          python scripts/candidate_release.py verify --candidate-dir $candidate

      - name: Upload candidate artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-windows-candidate-run-${{ github.run_id }}
          path: dist-onedir/candidates/run-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Show candidate identity for desktop acceptance
        shell: pwsh
        run: |
          $candidate = "dist-onedir/candidates/run-${{ github.run_id }}"
          $receiptHash = (Get-FileHash -Algorithm SHA256 "$candidate/candidate-receipt.json").Hash.ToLowerInvariant()
          @(
            "Candidate run ID: ${{ github.run_id }}",
            "Artifact ID: ${{ steps.upload.outputs.artifact-id }}",
            "Commit: ${{ github.sha }}",
            "Receipt SHA-256: $receiptHash"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  clean-portable-native:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download portable candidate only
        uses: actions/download-artifact@v4
        with:
          name: dsh-pet-windows-candidate-run-${{ github.run_id }}
          path: candidate

      - name: Setup Python for receipt verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify complete candidate receipt
        shell: pwsh
        run: python candidate/candidate_release.py verify --candidate-dir candidate

      - name: Verify frozen native on fresh Windows runner
        shell: pwsh
        run: |
          $script = Get-ChildItem candidate -Recurse -Filter verify_portable_native.ps1 -File | Select-Object -First 1
          if (-not $script) { throw 'Portable verifier missing from artifact' }
          $archives = @(Get-ChildItem candidate -Recurse -Filter '*-portable.zip' -File)
          if ($archives.Count -ne 2) { throw "Expected two WebM candidates, found $($archives.Count)" }
          foreach ($archive in $archives) {
            & $script.FullName -Archive $archive.FullName
          }
