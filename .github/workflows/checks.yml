name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chatgpt
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            chatgpt/requirements.txt
            share/requirements.txt
            share/requirements-assets.txt
      - run: python -m pip install -r requirements.txt -r ../share/requirements-assets.txt
      - run: python -m compileall -q app tools tests ../share ../claude ../gemini
      - run: python tools/check.py
      - run: python tools/check.py test_mp4_matte test_mp4_character test_mp4_drag test_exit_and_single_pack
      - run: python ../claude/tools/check.py
      - run: python ../gemini/tools/check.py
