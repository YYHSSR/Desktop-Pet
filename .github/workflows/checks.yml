name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Codex/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tools tests ../shared
      - run: python tools/check.py
